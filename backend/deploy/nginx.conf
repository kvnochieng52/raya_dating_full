# ─── Raya Dating — Laravel backend (Ubuntu / nginx / PHP-FPM 8.2) ───
#
# Deploy path:  /app/raya_dating_full/backend
# Public port:  9412  (uncommon, non-registered — change if it conflicts)
#
# Install steps below the `server { … }` block.

server {
    listen 9412;
    server_name _;  # accepts any hostname; replace `_` with your domain later.

    root  /app/raya_dating_full/backend/public;
    index index.php;

    access_log /var/log/nginx/raya-dating_access.log;
    error_log  /var/log/nginx/raya-dating_error.log;

    # Photo uploads. Bump higher if you ever accept video.
    client_max_body_size 20M;

    # Laravel front-controller pattern.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # confirm with `ls /var/run/php/`
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to dotfiles (.env, .git, .htaccess, …) but keep .well-known
    # available for Let's Encrypt if you later add certbot.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cheap wins on log noise.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

